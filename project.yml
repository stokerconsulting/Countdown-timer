name: Countdown
options:
  bundleIdPrefix: nl.stokerconsulting
  deploymentTarget:
    iOS: "17.0"
targets:
  Countdown:
    type: application
    platform: iOS
    sources: [Countdown, Shared]
    dependencies:
      - target: CountdownWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stokerconsulting.countdown
        DEVELOPMENT_TEAM: HQDSA3W27D
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Countdown
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
  CountdownWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [CountdownWatch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stokerconsulting.countdown.watchkitapp
        DEVELOPMENT_TEAM: HQDSA3W27D
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Countdown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: nl.stokerconsulting.countdown
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SWIFT_VERSION: "5.9"
